<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branch Management | CineVerse Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="adminBranches">

  <nav class="navbar navbar-expand-lg cinema-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/admin/dashboard.html">
        <span class="brand-icon"><i class="bi bi-shield-lock-fill"></i></span>
        <span>CINE<span style="color: var(--gold-primary);">ADMIN</span></span>
      </a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <a class="btn btn-glass btn-sm" href="/admin/dashboard.html"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
        <a class="btn btn-outline-light btn-sm" href="/index.html"><i class="bi bi-house me-1"></i> Public Site</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <div class="section-tag"><i class="bi bi-geo-alt"></i> THEATRE NETWORK</div>
        <h1 class="display-6 fw-bold text-white mb-0">Cinema Branch Management</h1>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card p-4 shadow-lg">
          <h4 class="mb-3 text-white fw-bold"><i class="bi bi-building-add text-warning me-2"></i>Add Branch</h4>
          <form id="branchForm">
            <div class="mb-3">
              <label class="form-label small text-muted">Branch Name</label>
              <input class="form-control" name="branchName" placeholder="e.g. Scope Colombo City Centre" required>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Physical Location / Address</label>
              <textarea class="form-control" name="location" rows="3" placeholder="Address, City..." required></textarea>
            </div>
            <button class="btn btn-accent w-100 py-2 fs-6" type="submit">
              <i class="bi bi-save me-1"></i> Save Branch
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-4 shadow-lg">
          <h4 class="mb-3 text-white fw-bold"><i class="bi bi-buildings me-2 text-warning"></i>Active Theatres</h4>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Branch Name</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="branchTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Branch Modal -->
  <div class="modal fade" id="editBranchModal" tabindex="-1" aria-labelledby="editBranchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-white fw-bold" id="editBranchModalLabel"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Branch</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editBranchForm">
          <div class="modal-body">
            <input type="hidden" id="editBranchId" name="id">
            <div class="mb-3">
              <label class="form-label small text-muted">Branch Name</label>
              <input class="form-control" id="editBranchName" name="branchName" required>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Location</label>
              <textarea class="form-control" id="editBranchLocation" name="location" rows="3" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-accent"><i class="bi bi-check-circle me-1"></i> Update Branch</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
