<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seat Management | CineVerse Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="adminSeats">

  <nav class="navbar navbar-expand-lg cinema-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/admin/dashboard.html">
        <span class="brand-icon"><i class="bi bi-shield-lock-fill"></i></span>
        <span>CINE<span style="color: var(--gold-primary);">ADMIN</span></span>
      </a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <a class="btn btn-glass btn-sm" href="/admin/dashboard.html"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
        <a class="btn btn-outline-light btn-sm" href="/index.html"><i class="bi bi-house me-1"></i> Public Site</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <div class="section-tag"><i class="bi bi-grid-3x3"></i> AUDITORIUM LAYOUT</div>
        <h1 class="display-6 fw-bold text-white mb-0">Seat Configuration</h1>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card p-4 shadow-lg">
          <h4 class="mb-3 text-white fw-bold"><i class="bi bi-plus-square text-warning me-2"></i>Add Seat</h4>
          <form id="seatForm">
            <div class="mb-3">
              <label class="form-label small text-muted">Screen / Auditorium</label>
              <select id="seatScreenSelect" class="form-select" name="screenId" required>
                <!-- Populated via JS -->
              </select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Row (A, B, C...)</label>
                <input class="form-control" name="rowName" placeholder="e.g. A" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Seat Number</label>
                <input class="form-control" type="number" name="seatNumber" placeholder="1" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Seat Category</label>
              <select class="form-select" name="seatType">
                <option value="STANDARD">STANDARD</option>
                <option value="PREMIUM">PREMIUM</option>
                <option value="VIP">VIP</option>
                <option value="ACCESSIBLE">ACCESSIBLE</option>
              </select>
            </div>
            <button class="btn btn-accent w-100 py-2 fs-6" type="submit">
              <i class="bi bi-save me-1"></i> Save Seat
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-4 shadow-lg">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0 text-white fw-bold"><i class="bi bi-ui-checks-grid me-2 text-warning"></i>Configured Seats</h4>
            <span id="seatCountBadge" class="badge bg-secondary">0 seats</span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Screen</th>
                  <th>Seat Code</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="seatTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Seat Modal -->
  <div class="modal fade" id="editSeatModal" tabindex="-1" aria-labelledby="editSeatModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-white fw-bold" id="editSeatModalLabel"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Seat Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editSeatForm">
          <div class="modal-body">
            <input type="hidden" id="editSeatId" name="id">
            <input type="hidden" id="editSeatScreenId" name="screenId">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Row Letter</label>
                <input class="form-control" id="editSeatRowName" name="rowName" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Seat Number</label>
                <input class="form-control" type="number" id="editSeatNumber" name="seatNumber" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Seat Category</label>
              <select class="form-select" id="editSeatType" name="seatType">
                <option value="STANDARD">STANDARD</option>
                <option value="PREMIUM">PREMIUM</option>
                <option value="VIP">VIP</option>
                <option value="ACCESSIBLE">ACCESSIBLE</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-accent"><i class="bi bi-check-circle me-1"></i> Update Seat</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
