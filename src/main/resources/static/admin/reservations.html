<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservation Management | CineVerse Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="adminReservations">

  <nav class="navbar navbar-expand-lg cinema-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/admin/dashboard.html">
        <span class="brand-icon"><i class="bi bi-shield-lock-fill"></i></span>
        <span>CINE<span style="color: var(--gold-primary);">ADMIN</span></span>
      </a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <a class="btn btn-glass btn-sm" href="/admin/dashboard.html"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
        <a class="btn btn-outline-light btn-sm" href="/index.html"><i class="bi bi-house me-1"></i> Public Site</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <div class="section-tag"><i class="bi bi-ticket-perforated"></i> BOOKINGS & TICKETS</div>
        <h1 class="display-6 fw-bold text-white mb-0">Reservation Management</h1>
      </div>
    </div>

    <!-- Search Form -->
    <form id="reservationSearchForm" class="card p-4 mb-4 shadow-lg">
      <div class="row g-2 align-items-center">
        <div class="col-md-9">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="bi bi-search"></i></span>
            <input class="form-control" name="term" placeholder="Search by booking reference (e.g. CR-...), customer name, or email...">
          </div>
        </div>
        <div class="col-md-3">
          <button class="btn btn-accent w-100 py-2" type="submit">
            <i class="bi bi-funnel me-1"></i> Filter Reservations
          </button>
        </div>
      </div>
    </form>

    <!-- Reservations Table -->
    <div class="card p-4 shadow-lg">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0 text-white fw-bold"><i class="bi bi-receipt me-2 text-warning"></i>Customer Reservations</h4>
        <span id="reservationCountBadge" class="badge bg-secondary">0 records</span>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Reference</th>
              <th>Customer</th>
              <th>Movie & Showtime</th>
              <th>Seats</th>
              <th>Total Amount</th>
              <th>Status</th>
              <th>Payment</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="reservationTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
