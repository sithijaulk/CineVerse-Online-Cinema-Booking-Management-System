<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showtime Management | CineVerse Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="adminShowtimes">

  <nav class="navbar navbar-expand-lg cinema-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/admin/dashboard.html">
        <span class="brand-icon"><i class="bi bi-shield-lock-fill"></i></span>
        <span>CINE<span style="color: var(--gold-primary);">ADMIN</span></span>
      </a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <a class="btn btn-glass btn-sm" href="/admin/dashboard.html"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
        <a class="btn btn-outline-light btn-sm" href="/index.html"><i class="bi bi-house me-1"></i> Public Site</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <div class="section-tag"><i class="bi bi-calendar-event"></i> SCHEDULES</div>
        <h1 class="display-6 fw-bold text-white mb-0">Showtime Scheduling</h1>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card p-4 shadow-lg">
          <h4 class="mb-3 text-white fw-bold"><i class="bi bi-calendar-plus text-warning me-2"></i>Schedule Show</h4>
          <form id="showtimeForm">
            <div class="mb-3">
              <label class="form-label small text-muted">Movie</label>
              <select id="showtimeMovieSelect" class="form-select" name="movieId" required>
                <!-- Populated via JS -->
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Screen & Branch</label>
              <select id="showtimeScreenSelect" class="form-select" name="screenId" required>
                <!-- Populated via JS -->
              </select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Show Date</label>
                <input class="form-control" type="date" name="showDate" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Start Time</label>
                <input class="form-control" type="time" name="startTime" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Ticket Price (LKR)</label>
                <input class="form-control" type="number" step="0.01" name="ticketPrice" placeholder="2500.00" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Status</label>
                <select class="form-select" name="status">
                  <option value="SCHEDULED">SCHEDULED</option>
                  <option value="RESCHEDULED">RESCHEDULED</option>
                  <option value="CANCELLED">CANCELLED</option>
                </select>
              </div>
            </div>
            <button class="btn btn-accent w-100 py-2 fs-6" type="submit">
              <i class="bi bi-save me-1"></i> Save Showtime
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-4 shadow-lg">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0 text-white fw-bold"><i class="bi bi-clock-history me-2 text-warning"></i>Active Showtimes</h4>
            <span id="showtimeCountBadge" class="badge bg-secondary">0 showtimes</span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Movie</th>
                  <th>Screen</th>
                  <th>Date & Time</th>
                  <th>Price</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="showtimeTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Showtime Modal -->
  <div class="modal fade" id="editShowtimeModal" tabindex="-1" aria-labelledby="editShowtimeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-white fw-bold" id="editShowtimeModalLabel"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Showtime</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editShowtimeForm">
          <div class="modal-body">
            <input type="hidden" id="editShowtimeId" name="id">
            <input type="hidden" id="editShowtimeMovieId" name="movieId">
            <input type="hidden" id="editShowtimeScreenId" name="screenId">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Show Date</label>
                <input class="form-control" type="date" id="editShowtimeDate" name="showDate" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Start Time</label>
                <input class="form-control" type="time" id="editShowtimeTime" name="startTime" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Ticket Price (LKR)</label>
                <input class="form-control" type="number" step="0.01" id="editShowtimePrice" name="ticketPrice" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Status</label>
                <select class="form-select" id="editShowtimeStatus" name="status">
                  <option value="SCHEDULED">SCHEDULED</option>
                  <option value="RESCHEDULED">RESCHEDULED</option>
                  <option value="CANCELLED">CANCELLED</option>
                  <option value="COMPLETED">COMPLETED</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-accent"><i class="bi bi-check-circle me-1"></i> Update Showtime</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
