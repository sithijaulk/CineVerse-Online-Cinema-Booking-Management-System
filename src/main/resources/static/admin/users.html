<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Management | CineVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="adminUsers">
  <nav class="navbar navbar-expand-lg cinema-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/admin/dashboard.html"><span class="brand-icon"><i class="bi bi-shield-lock-fill"></i></span><span>CINE<span style="color: var(--gold-primary);">ADMIN</span></span></a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill" id="themeIcon"></i></button>
        <a class="btn btn-outline-light btn-sm" href="/admin/dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
        <a class="btn btn-glass btn-sm text-danger" href="/logout"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div><div class="section-tag"><i class="bi bi-people"></i> ADMINISTRATION</div><h1 class="display-6 fw-bold text-white mb-0">User Management</h1><p class="text-muted mb-0">Manage client roles and account access status.</p></div>
    </div>
    <div id="userMessage" class="mb-3"></div>
    <div class="card p-4 shadow-lg mb-4">
      <h5 class="text-white fw-bold mb-3"><i class="bi bi-person-plus text-warning me-2"></i>Add Staff or User</h5>
      <form id="createUserForm" class="row g-3">
        <div class="col-md-4"><input class="form-control" name="fullName" placeholder="Full name" minlength="2" maxlength="80" required></div>
        <div class="col-md-4"><input class="form-control" type="email" name="email" placeholder="Email address" required></div>
        <div class="col-md-4"><input class="form-control" type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required></div>
        <div class="col-md-4"><input class="form-control" name="phone" placeholder="10 digit mobile" pattern="[0-9]{10}" minlength="10" maxlength="10" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)" required></div>
        <div class="col-md-4"><select class="form-select" name="role"><option value="STAFF">STAFF</option><option value="CUSTOMER">CUSTOMER</option><option value="ADMIN">ADMIN</option></select></div>
        <div class="col-md-4"><button class="btn btn-accent w-100" type="submit"><i class="bi bi-plus-circle me-1"></i>Create Account</button></div>
      </form>
    </div>
    <div class="card p-4 shadow-lg">
      <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Client</th><th>Contact</th><th>Role</th><th>Status</th><th class="text-end">Save</th></tr></thead><tbody id="userTableBody"><tr><td colspan="5" class="text-center py-4 text-muted">Loading users...</td></tr></tbody></table></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
