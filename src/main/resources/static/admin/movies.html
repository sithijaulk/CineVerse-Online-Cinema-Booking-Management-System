<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Management | CineVerse Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="adminMovies">

  <nav class="navbar navbar-expand-lg cinema-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/admin/dashboard.html">
        <span class="brand-icon"><i class="bi bi-shield-lock-fill"></i></span>
        <span>CINE<span style="color: var(--gold-primary);">ADMIN</span></span>
      </a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <a class="btn btn-glass btn-sm" href="/admin/dashboard.html"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
        <a class="btn btn-outline-light btn-sm" href="/index.html"><i class="bi bi-house me-1"></i> Public Site</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <div class="section-tag"><i class="bi bi-film"></i> CATALOGUE MANAGEMENT</div>
        <h1 class="display-6 fw-bold text-white mb-0">Movie Management</h1>
      </div>
    </div>

    <div class="row g-4">
      <!-- Create / Add Movie Form -->
      <div class="col-lg-5">
        <div class="card p-4 shadow-lg">
          <h4 class="mb-3 text-white fw-bold"><i class="bi bi-plus-circle-fill text-warning me-2"></i>Add New Movie</h4>
          <form id="movieForm">
            <div class="mb-3">
              <label class="form-label small text-muted">Movie Title</label>
              <input class="form-control" name="title" placeholder="e.g. Dune: Part Two" required>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Description / Synopsis</label>
              <textarea class="form-control" name="description" rows="3" placeholder="Plot synopsis..." required></textarea>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-muted">Genre</label>
                <input class="form-control" name="genre" placeholder="Action / Sci-Fi" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Language</label>
                <input class="form-control" name="language" placeholder="English" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Duration (Mins)</label>
                <input class="form-control" type="number" name="durationMinutes" placeholder="150" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Release Date</label>
                <input class="form-control" type="date" name="releaseDate" min="1900-01-01" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Age Rating</label>
                <input class="form-control" name="ageRating" placeholder="PG-13 / R" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">Status</label>
                <select class="form-select" name="status">
                  <option value="NOW_SHOWING">NOW SHOWING</option>
                  <option value="COMING_SOON">COMING SOON</option>
                  <option value="NO_LONGER_SHOWING">NO LONGER SHOWING</option>
                </select>
              </div>
            </div>

            <!-- Poster Image Upload & Preview -->
            <div class="mb-3">
              <label class="form-label small text-muted">Poster Image</label>
              <div class="input-group mb-2">
                <input id="movieFileInput" type="file" class="form-control" accept="image/*">
                <button id="uploadPosterBtn" type="button" class="btn btn-glass"><i class="bi bi-upload"></i> Upload</button>
              </div>
              <input id="moviePosterUrl" class="form-control mb-2" name="posterUrl" placeholder="Or enter image URL...">
              <div id="posterPreviewWrap" class="d-none text-center p-2 rounded" style="background: rgba(0,0,0,0.3);">
                <img id="posterPreviewImg" src="" alt="Poster Preview" style="max-height: 120px; border-radius: 8px;">
                <div class="small text-success mt-1"><i class="bi bi-check-circle me-1"></i>Image ready</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small text-muted">Trailer Video URL</label>
              <input class="form-control" name="trailerUrl" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <button class="btn btn-accent w-100 py-2 fs-6" type="submit">
              <i class="bi bi-save me-1"></i> Save Movie
            </button>
          </form>
        </div>
      </div>

      <!-- Movies Table -->
      <div class="col-lg-7">
        <div class="card p-4 shadow-lg">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0 text-white fw-bold"><i class="bi bi-collection-play me-2 text-warning"></i>Active Movies</h4>
            <span id="movieCountBadge" class="badge bg-secondary">0 movies</span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Poster</th>
                  <th>Title & Genre</th>
                  <th>Duration</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="movieTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Movie Modal -->
  <div class="modal fade" id="editMovieModal" tabindex="-1" aria-labelledby="editMovieModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-white fw-bold" id="editMovieModalLabel"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Movie Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editMovieForm">
          <div class="modal-body">
            <input type="hidden" id="editMovieId" name="id">
            <div class="mb-3">
              <label class="form-label small text-muted">Title</label>
              <input class="form-control" id="editMovieTitle" name="title" required>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Description</label>
              <textarea class="form-control" id="editMovieDescription" name="description" rows="3" required></textarea>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small text-muted">Genre</label>
                <input class="form-control" id="editMovieGenre" name="genre" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Language</label>
                <input class="form-control" id="editMovieLanguage" name="language" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Duration (Minutes)</label>
                <input class="form-control" type="number" id="editMovieDuration" name="durationMinutes" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Release Date</label>
                <input class="form-control" type="date" id="editMovieReleaseDate" name="releaseDate" min="1900-01-01" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Age Rating</label>
                <input class="form-control" id="editMovieAgeRating" name="ageRating" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Status</label>
                <select class="form-select" id="editMovieStatus" name="status">
                  <option value="NOW_SHOWING">NOW SHOWING</option>
                  <option value="COMING_SOON">COMING SOON</option>
                  <option value="NO_LONGER_SHOWING">NO LONGER SHOWING</option>
                </select>
              </div>
            </div>

            <!-- Edit Poster Upload & URL -->
            <div class="mb-3">
              <label class="form-label small text-muted">Poster Image</label>
              <div class="input-group mb-2">
                <input id="editMovieFileInput" type="file" class="form-control" accept="image/*">
                <button id="editUploadPosterBtn" type="button" class="btn btn-glass"><i class="bi bi-upload"></i> Upload</button>
              </div>
              <input class="form-control mb-2" id="editMoviePosterUrl" name="posterUrl" placeholder="Poster URL">
              <div id="editPosterPreviewWrap" class="text-center p-2 rounded" style="background: rgba(0,0,0,0.3);">
                <img id="editPosterPreviewImg" src="" alt="Poster" style="max-height: 140px; border-radius: 8px;">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small text-muted">Trailer Video URL</label>
              <input class="form-control" id="editMovieTrailerUrl" name="trailerUrl">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-accent"><i class="bi bi-check-circle me-1"></i> Update Movie</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
