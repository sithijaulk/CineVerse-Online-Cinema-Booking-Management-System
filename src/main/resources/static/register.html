<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | CineVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

  <!-- Header -->
  <header class="py-3 border-bottom border-secondary border-opacity-25">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand justify-content-center" href="/index.html">
        <span class="brand-icon"><i class="bi bi-film"></i></span>
        <span>CINE<span style="color: var(--gold-primary);">VERSE</span></span>
      </a>
      <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle theme">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <main class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="glass-panel p-4 p-md-5 rounded-4 shadow-lg">
          <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-white mb-2">Create Your Account</h1>
            <p class="text-muted small">Sign up to reserve cinema seats, unlock VIP discounts, and store e-tickets.</p>
          </div>

          <div id="registerMessage"></div>

          <form id="registerForm" class="mt-3">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label small text-muted">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary auth-input-icon"><i class="bi bi-person"></i></span>
                  <input class="form-control custom-select-dark" name="fullName" placeholder="e.g. John Doe" minlength="2" maxlength="80" required>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label small text-muted">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary auth-input-icon"><i class="bi bi-envelope"></i></span>
                  <input class="form-control custom-select-dark" type="email" name="email" placeholder="name@example.com" maxlength="120" required>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary auth-input-icon"><i class="bi bi-lock"></i></span>
                  <input class="form-control custom-select-dark" type="password" name="password" placeholder="••••••••" minlength="8" maxlength="255" required>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Phone Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary auth-input-icon"><i class="bi bi-phone"></i></span>
                  <input class="form-control custom-select-dark" name="phone" placeholder="0771234567" pattern="[0-9]{10}" inputmode="numeric" minlength="10" maxlength="10" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)" required>
                </div>
              </div>
            </div>

            <button class="btn btn-accent w-100 py-2 fs-6 mt-4" type="submit">
              <i class="bi bi-person-check-fill me-1"></i> Register Account
            </button>
          </form>

          <div class="text-center text-muted small mt-4">
            Already have an account? <a href="/login.html" class="text-warning text-decoration-none fw-bold">Sign In here</a>
          </div>

          <hr class="my-4 border-secondary border-opacity-50">
          <div class="text-center">
            <a href="/index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-muted small border-top border-secondary border-opacity-25">
    &copy; 2026 CineVerse Theatres. All rights reserved.
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = Object.fromEntries(new FormData(event.target).entries());
      const msg = document.getElementById('registerMessage');
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        if (!response.ok) {
          const payload = await response.json();
          const details = payload.fieldErrors ? Object.entries(payload.fieldErrors).map(([field, text]) => `${field}: ${text}`).join('<br>') : '';
          throw new Error(details || payload.message || payload.error || 'Registration failed');
        }
        msg.innerHTML = '<div class="alert alert-success py-2 small">Registration successful! Redirecting to sign in...</div>';
        setTimeout(() => window.location.href = '/login.html', 1200);
      } catch (error) {
        msg.innerHTML = `<div class="alert alert-danger py-2 small">${error.message}</div>`;
      }
    });
  </script>
</body>
</html>
