<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | CineVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

  <!-- Minimal Brand Header -->
  <header class="py-3 border-bottom border-secondary border-opacity-25">
    <div class="container text-center">
      <a class="navbar-brand justify-content-center" href="/index.html">
        <span class="brand-icon"><i class="bi bi-film"></i></span>
        <span>CINE<span style="color: var(--gold-primary);">VERSE</span></span>
      </a>
    </div>
  </header>

  <main class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="glass-panel p-4 p-md-5 rounded-4 shadow-lg">
          <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-white mb-2">Welcome Back</h1>
            <p class="text-muted small">Sign in to book tickets, view orders, or access management portals.</p>
          </div>

          <div id="loginMessage"></div>

          <form id="loginForm" class="mt-3">
            <div class="mb-3">
              <label class="form-label small text-muted">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary auth-input-icon"><i class="bi bi-envelope"></i></span>
                <input class="form-control custom-select-dark" type="email" name="email" placeholder="name@example.com" maxlength="120" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label small text-muted">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary auth-input-icon"><i class="bi bi-lock"></i></span>
                <input class="form-control custom-select-dark" type="password" name="password" placeholder="••••••••" minlength="8" maxlength="255" required>
              </div>
            </div>
            <button class="btn btn-accent w-100 py-2 fs-6 mb-3" type="submit">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <div class="text-center text-muted small mt-4">
            Don't have an account? <a href="/register.html" class="text-warning text-decoration-none fw-bold">Sign Up here</a>
          </div>

          <hr class="my-4 border-secondary border-opacity-50">
          <div class="text-center">
            <a href="/index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-muted small border-top border-secondary border-opacity-25">
    &copy; 2026 CineVerse Theatres. All rights reserved.
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = Object.fromEntries(new FormData(event.target).entries());
      const message = document.getElementById('loginMessage');
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(form)
        });
        const payload = await response.json();
        if (!response.ok) {
          const details = payload.fieldErrors ? Object.entries(payload.fieldErrors).map(([field, text]) => `${field}: ${text}`).join('<br>') : '';
          throw new Error(details || payload.message || 'Invalid email or password');
        }
        if (payload.role === 'ADMIN') {
          window.location.href = '/admin/dashboard.html';
        } else if (payload.role === 'STAFF') {
          window.location.href = '/staff/dashboard.html';
        } else {
          window.location.href = '/index.html';
        }
      } catch (error) {
        message.innerHTML = `<div class="alert alert-danger py-2 small">${error.message}</div>`;
      }
    });
  </script>
</body>
</html>
