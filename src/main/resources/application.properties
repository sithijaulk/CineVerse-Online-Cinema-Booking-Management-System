spring.application.name=cinema-reservation

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cinema_reservation?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
# The standalone database SQL file already contains the latest schema (V2).
# Baseline that existing database at V2 while keeping migrations for empty databases.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

server.port=8080

app.booking.hold-minutes=${BOOKING_HOLD_MINUTES:10}
app.seed.enabled=${SEED_DEMO_DATA:true}
